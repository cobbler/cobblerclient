on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # Go 1.22.x setup fails on macOS runners: https://stackoverflow.com/a/79790775
          - go-version: 1.22.x
            os: macos-latest
          - go-version: 1.23.x
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Test
        run: go test -race -coverprofile="coverage.out" -covermode="atomic" -v ./...
      - name: Upload test coverage to Codacy
        if: matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report --force-coverage-parser go -r coverage.out
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: ${{ secrets.CODACY_ORGANIZATION_PROVIDER }}
          CODACY_USERNAME: ${{ secrets.CODACY_USERNAME }}
          CODACY_PROJECT_NAME: ${{ secrets.CODACY_PROJECT_NAME }}
